<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прочитай и расставь по порядку</title>
<style>
:root {
  color-scheme: light;
  --ink: #123b3a; --teal: #006961; --slot-line: #26a79a;
  --turquoise: #26c6ba; --mint: #e4fbf8; --line: #a8e9dc;
  --green: #39851c; --lime: #b8ed60; --red: #dc3451;
  --card: min(24vw, 22dvh, 170px);
  font-family: "Trebuchet MS", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; align-items: center; padding: 12px;
  color: var(--ink);
  background:
    radial-gradient(circle at 8% 14%, #bdf267 0 16px, transparent 17px),
    radial-gradient(circle at 96% 75%, #75e0d2 0 24px, transparent 25px),
    radial-gradient(ellipse at 0% 95%, #caf8ef 0 10%, transparent 38%),
    radial-gradient(ellipse at 100% 0%, #ccfaad 0 9%, transparent 44%),
    #effcf8;
}
main {
  width: min(100%, 924px); margin: auto; padding: clamp(9px, 2vh, 17px) clamp(9px, 3vw, 32px);
  border: 3px solid #94ddd0; border-radius: 28px;
  background: #fff; box-shadow: 0 7px 0 #a8e6da;
}
header { text-align: center; margin-bottom: clamp(7px, 1.45vh, 13px); }
h1 { margin: 0; color: var(--teal); font-size: clamp(1.42rem, 4vw, 2.32rem); line-height: 1.06; }
header p { margin: 7px 0 0; font-size: clamp(.88rem, 2.6vw, 1.14rem); }
.board, .bank { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(6px, 2vw, 16px); }
.slot, .picture {
  display: grid; place-items: center; position: relative; width: var(--card); height: var(--card);
  padding: 0; border: 3px solid; border-radius: 18px; overflow: hidden;
}
.slot {
  border-color: var(--slot-line); border-style: dashed; background: #edfdf9;
  transition: background .14s, border-color .14s;
}
.slot.drop-ready { background: #d7f6a4; border-color: var(--teal); }
.slot.correct { border: 4px solid var(--green); background: #eafaad; }
.slot.correct::after, .slot.wrong::after {
  position: absolute; top: 4px; right: 4px; border-radius: 50%; display: grid; place-items: center;
  width: 25px; height: 25px; font: bold 19px/1 system-ui; color: #fff;
  content: "✓"; background: var(--green);
}
.slot.wrong { border: 4px solid var(--red); background: #ffe6ed; }
.slot.wrong::after { content: "×"; background: var(--red); }
.slot img, .picture img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.bank {
  margin-top: clamp(9px, 2.25vh, 19px); padding: clamp(7px, 1.5vh, 13px) 0;
  background: var(--mint); border: 3px solid var(--turquoise);
  border-radius: 23px; justify-items: center;
}
.picture {
  background: #f8fffe; border-color: #149f98; box-shadow: 0 4px 0 #a5e4de;
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  transition: box-shadow .15s, border-color .15s;
}
.picture:not(.moving):not(.used):hover { border-color: #08746f; box-shadow: 0 4px 0 #71d5ca; }
.picture:focus-visible, #again:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
.picture.moving img { opacity: .19; }
.picture.used { visibility: hidden; pointer-events: none; }
.flying {
  position: fixed; z-index: 10; pointer-events: none; object-fit: cover;
  border: 3px solid var(--turquoise); border-radius: 17px; box-shadow: 0 4px 14px #123b3a43;
}
footer {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 7px 13px;
  min-height: 38px; margin-top: 7px; text-align: center; font-size: clamp(.84rem, 2.35vw, 1rem); font-weight: 700;
}
#feedback { margin: 0; }
#feedback[data-kind="wrong"] { color: #a41e3b; }
#feedback[data-kind="correct"] { color: #326a1f; }
#again {
  border: 2px solid #79b934; border-radius: 12px; padding: 5px 14px; min-height: 34px;
  font: inherit; color: #263609; background: var(--lime); cursor: pointer;
}
#again:hover { background: #a8dc50; }
@media (max-width: 440px) {
  body { padding: 7px; }
  main { border-radius: 21px; }
  .slot, .picture { border-radius: 12px; }

  .bank { border-radius: 17px; }
}
@media (max-height: 530px) {
  :root { --card: min(24vw, 21vh, 126px); }
  body { padding: 6px; }
  main { padding-block: 8px; }
}

.rotate-message { display: none; }
@media (max-height: 570px) and (orientation: landscape) {
  :root { --card: min(24vw, 25dvh, 145px); }
  body { padding: 6px; }
  main { padding-block: 8px; }
  header { margin-bottom: 8px; }
  header p { margin-top: 4px; }
  h1 { font-size: clamp(1.35rem, 4dvh, 2rem); }
  .column { gap: 5px; }
  .bank { margin-top: 9px; padding-block: 6px; }
  footer { margin-top: 5px; min-height: 34px; }
}
@media (max-height: 400px) and (orientation: landscape) {
  :root { --card: min(24vw, 19dvh, 76px); }
  body { padding: 4px; }
  main { padding-block: 5px; }
  header { margin-bottom: 5px; }
  header p { font-size: .88rem; }

  .bank { margin-top: 6px; padding-block: 4px; }
  footer { margin-top: 3px; }
}
@media (orientation: portrait) and (pointer: coarse), (orientation: portrait) and (max-width: 1100px) {
  body { min-height: 100dvh; padding: 18px; }
  main { display: none; }
  .rotate-message { display: grid; place-items: center; }
  .rotate-message > div {
    width: min(100%, 530px); padding: 26px 18px; text-align: center;
    border-radius: 24px; border: 3px solid #94ddd0; background: #fff;
  }
  .rotate-message p { margin-bottom: 0; }
}

.story-card {
  display: grid; width: 100%; margin: 0 auto clamp(8px, 1.7vh, 16px);
  padding: 0; border: 0; border-radius: 16px; background: transparent;
  font: inherit; color: var(--ink); cursor: pointer; text-align: center;
  perspective: 850px; -webkit-tap-highlight-color: transparent;
}
.story-card:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
.story-face {
  grid-area: 1 / 1; display: grid; place-content: center; gap: 4px;
  min-height: clamp(72px, 12dvh, 105px); padding: 8px clamp(9px, 3vw, 25px);
  border: 3px solid #91c940; border-radius: inherit; background: #e8fac8;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transition: transform .32s ease, visibility 0s linear .16s;
}
.story-face.back {
  transform: rotateY(-180deg); visibility: hidden; border-color: #26a79a; background: #d6f7f2;
}
.story-card[aria-expanded="false"] .front { transform: rotateY(180deg); visibility: hidden; }
.story-card[aria-expanded="false"] .back { transform: rotateY(0deg); visibility: visible; }
#story-text { font-weight: 700; font-size: clamp(.95rem, 2.35vw, 1.32rem); line-height: 1.25; }
.story-hint { color: var(--teal); font-weight: 700; font-size: clamp(.77rem, 1.55vw, .91rem); }
.back strong { font-size: clamp(1rem, 2.1vw, 1.27rem); }
.slot { justify-self: center; }
.slot-number { color: var(--teal); font-size: clamp(1.8rem, 5.8dvh, 3.15rem); font-weight: 800; }
.slot.correct .slot-number {
  position: absolute; left: 4px; top: 4px; min-width: 1.5em; height: 1.5em;
  display: grid; place-items: center; border-radius: 50%; color: var(--ink); background: #e8fac8;
  font-size: clamp(.85rem, 2.8dvh, 1.12rem);
}
@media (prefers-reduced-motion: reduce) {
  .story-face { transition: none; }
}
@media (max-height: 570px) and (orientation: landscape) {
  :root { --card: min(24vw, 22dvh, 135px); }
  .story-face { min-height: 72px; }
}
@media (max-height: 410px) and (orientation: landscape) {
  :root { --card: min(24vw, 18dvh, 80px); }
  .story-card { margin-bottom: 6px; }
  .story-face { min-height: 0; gap: 2px; padding-block: 4px; }
  #story-text { font-size: .9rem; }
  .story-hint { font-size: .75rem; }
}

main { width: min(100%, 1030px); }
.exercise-layout {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.85fr);
  align-items: stretch; gap: clamp(10px, 2.3vw, 25px);
  --card: min(14vw, 25dvh, 165px);
}
.picture-area { min-width: 0; }
.story-card { margin: 0; text-align: left; }
.story-face { place-content: center stretch; gap: 12px; padding: clamp(12px, 2.1vw, 23px); }
.story-face.back { text-align: center; }
#story-text { font-size: clamp(1rem, 2.25vw, 1.45rem); line-height: 1.43; }
@media (max-height: 480px) and (orientation: landscape) {
  .exercise-layout { --card: min(14vw, 26dvh, 122px); }
  .story-face { gap: 7px; padding: 9px 12px; }
  #story-text { font-size: clamp(.96rem, 2.4vw, 1.17rem); line-height: 1.28; }
}
@media (max-height: 360px) and (orientation: landscape) {
  .exercise-layout { --card: min(14vw, 23dvh, 82px); }
}

.story-card .story-hint { font-size: .66rem; font-weight: 400; }
.story-face.back {
  background:
    radial-gradient(ellipse at 0% 100%, #aee6cf 0 20%, transparent 62%),
    radial-gradient(ellipse at 100% 0%, #d8f69d 0 14%, transparent 57%),
    #d6f7f2;
}
#progress { margin: 0; color: var(--teal); font-size: .85em; }
</style>
</head>
<body>
<div class="rotate-message">
  <div><h1>Поверните устройство</h1><p>Откройте задание в альбомном режиме.</p></div>
</div>
<main>
  <header>

  <div class="exercise-layout">

    <span class="story-face front">
      <span id="story-text"></span>
      <span class="story-hint">(Нажми, чтобы скрыть историю)</span>
    </span>
    <span class="story-face back" aria-hidden="true"></span>
  </button>
  <div class="picture-area">
  <section class="board" id="board" aria-label="Окошки 1, 2 и 3"></section>
  <section class="bank" id="bank" aria-label="Картинки"></section>
  </div>
  </div>
  <footer>
    <p id="progress"></p>
    <p id="feedback" aria-live="polite"></p>
    <button id="again" type="button" hidden>Ещё раз</button>
  </footer>
</main>

let storyIndex = 0;
let storyOrder;
let scenes;

const board = document.querySelector("#board");
const bank = document.querySelector("#bank");
const storyCard = document.querySelector("#story-card");
const storyText = document.querySelector("#story-text");
const progress = document.querySelector("#progress");
const feedback = document.querySelector("#feedback");
const again = document.querySelector("#again");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
let slots = [];
let completed = 0;
let busy = false;
let pointerGesture = null;
let draggedButton = null;
const storageKey = "reading-sequence-preferences";
let previous = { stories: "", actions: {} };
try {
  const saved = JSON.parse(sessionStorage.getItem(storageKey));
  if (typeof saved?.stories === "string" && saved.actions) previous = saved;
} catch {}

function rememberOrders() {
  try { sessionStorage.setItem(storageKey, JSON.stringify(previous)); } catch {}
}
let lastPictureOrder = "";

function shuffled(previous, ...excluded) {
  const choices = scenes.flatMap((first) => scenes.filter((second) => second !== first)
    .map((second) => [first, second, scenes.find((other) => other !== first && other !== second)]))
    .filter((order) => ![previous, ...excluded].includes(order.map((scene) => scene.id).join()));
  return choices[Math.floor(Math.random() * choices.length)];
}

function setFeedback(text = "", kind = "") {
  feedback.textContent = text;
  feedback.dataset.kind = kind;
}

function imageFor(scene) {
  const image = new Image();
  image.src = scene.url;
  image.alt = scene.phrase;
  image.draggable = false;
  return image;
}

function startRound() {
  storyOrder = [...stories];
  for (let i = storyOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [storyOrder[i], storyOrder[j]] = [storyOrder[j], storyOrder[i]];
  }
  if (storyOrder.map((story) => story.id).join() === previous.stories) {
    storyOrder.push(storyOrder.shift());
  }
  previous.stories = storyOrder.map((story) => story.id).join();
  storyIndex = 0;
  rememberOrders();
}

function setStoryVisible(visible) {
  storyCard.setAttribute("aria-expanded", String(visible));
  storyCard.querySelector(".front").setAttribute("aria-hidden", String(!visible));
  if (visible) storyCard.removeAttribute("aria-label");
  else storyCard.setAttribute("aria-label", "Показать рассказ");
}

function restart() {
  const story = storyOrder[storyIndex];
  scenes = story.scenes;
  progress.textContent = "История " + (storyIndex + 1) + " из " + stories.length;
  board.replaceChildren();
  bank.replaceChildren();
  again.hidden = true;
  completed = 0;
  setFeedback();
  const order = shuffled(previous.actions[story.id]);
  const actionOrder = order.map((scene) => scene.id).join();
  previous.actions[story.id] = actionOrder;
  rememberOrders();
  storyText.textContent = "Сначала " + story.subject + " " + order[0].action + ". Потом " + story.pronoun + " " + order[1].action + ", а после этого " + order[2].action + ".";
  setStoryVisible(true);

  const pictures = shuffled(lastPictureOrder, actionOrder);
  lastPictureOrder = pictures.map((scene) => scene.id).join();
  slots = order.map((scene, index) => {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.dataset.scene = scene.id;
    slot.setAttribute("role", "group");
    slot.setAttribute("aria-label", "Окошко " + (index + 1));
    const number = document.createElement("span");
    number.className = "slot-number";
    number.setAttribute("aria-hidden", "true");
    number.textContent = index + 1;
    slot.append(number);
    board.append(slot);
    return slot;
  });

  pictures.forEach((scene, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "picture";
    button.dataset.scene = scene.id;
    button.setAttribute("aria-label", "Картинка " + (index + 1) + ". " + scene.phrase);
    button.append(imageFor(scene));
    button.addEventListener("click", (event) => {
      if (event.detail && draggedButton === button) return;
      attempt(button, slots.find((slot) => !slot.classList.contains("correct")));
    });
    button.addEventListener("pointerdown", startPointer);
    button.addEventListener("pointermove", movePointer);
    button.addEventListener("pointerup", (event) => finishPointer(event, false));
    button.addEventListener("pointercancel", (event) => finishPointer(event, true));
    button.addEventListener("lostpointercapture", (event) => finishPointer(event, true));
    bank.append(button);
  });
}

function placeStyle(rect) {
  return { left: rect.left + "px", top: rect.top + "px", width: rect.width + "px", height: rect.height + "px" };
}

function makeFlying(button) {
  const ghost = button.firstElementChild.cloneNode();
  ghost.className = "flying";
  ghost.alt = "";
  ghost.setAttribute("aria-hidden", "true");
  Object.assign(ghost.style, placeStyle(button.getBoundingClientRect()));
  document.body.append(ghost);
  button.classList.add("moving");
  return ghost;
}

async function fly(ghost, target, duration) {
  const end = placeStyle(target.getBoundingClientRect());
  if (!reduceMotion.matches) {
    const start = placeStyle(ghost.getBoundingClientRect());
    await ghost.animate([start, end], { duration, easing: "ease-out" }).finished;
  }
  Object.assign(ghost.style, end);
}

async function attempt(button, slot, floating) {
  if (busy || !slot || button.disabled) return;
  busy = true;
  const ghost = floating || makeFlying(button);
  const wasFocused = document.activeElement === button;
  try {
    await fly(ghost, slot, 165);
    if (slot.dataset.scene === button.dataset.scene && !slot.classList.contains("correct")) {
      slot.append(button.firstElementChild.cloneNode());
      slot.classList.add("correct");
      button.disabled = true;
      button.classList.add("used");
      completed++;
      if (completed === scenes.length) {
        const finished = storyIndex + 1 === storyOrder.length;
        setFeedback(finished ? "Все истории пройдены!" : "Отлично! Все картинки на своих местах.", "correct");
        again.textContent = finished ? "Ещё раз" : "Дальше";
        again.hidden = false;
        if (wasFocused) again.focus();
      } else {
        setFeedback("Верно!", "correct");
        if (wasFocused) bank.querySelector(".picture:not(:disabled)").focus();
      }
    } else {
      slot.classList.add("wrong");
      ghost.style.borderColor = "var(--red)";
      setFeedback("Попробуй ещё раз.", "wrong");
      await new Promise((resolve) => setTimeout(resolve, 500));
      slot.classList.remove("wrong");
      ghost.style.borderColor = "";
      await fly(ghost, button, 190);
    }
  } finally {
    ghost.remove();
    button.classList.remove("moving");
    busy = false;
  }
}

function startPointer(event) {
  if (busy || pointerGesture || event.button !== 0 || event.currentTarget.disabled) return;
  const button = event.currentTarget;
  draggedButton = null;
  const rect = button.getBoundingClientRect();
  pointerGesture = {
    button, id: event.pointerId, x: event.clientX, y: event.clientY,
    offsetX: event.clientX - rect.left, offsetY: event.clientY - rect.top,
    ghost: null, drop: null,
  };
  button.setPointerCapture(event.pointerId);
}

function slotAt(x, y) {
  return document.elementFromPoint(x, y)?.closest(".slot") || null;
}

function movePointer(event) {
  const gesture = pointerGesture;
  if (!gesture || gesture.id !== event.pointerId) return;
  if (!gesture.ghost && Math.hypot(event.clientX - gesture.x, event.clientY - gesture.y) < 7) return;
  gesture.ghost ||= makeFlying(gesture.button);
  gesture.ghost.style.left = (event.clientX - gesture.offsetX) + "px";
  gesture.ghost.style.top = (event.clientY - gesture.offsetY) + "px";
  gesture.drop?.classList.remove("drop-ready");
  gesture.drop = slotAt(event.clientX, event.clientY);
  gesture.drop?.classList.add("drop-ready");
}

async function finishPointer(event, cancelled) {
  const gesture = pointerGesture;
  if (!gesture || gesture.id !== event.pointerId) return;
  pointerGesture = null;
  gesture.drop?.classList.remove("drop-ready");
  if (!gesture.ghost) return;
  draggedButton = gesture.button;
  const target = cancelled ? null : slotAt(event.clientX, event.clientY);
  if (target) {
    await attempt(gesture.button, target, gesture.ghost);
    return;
  }
  busy = true;
  try {
    await fly(gesture.ghost, gesture.button, 190);
  } finally {
    gesture.ghost.remove();
    gesture.button.classList.remove("moving");
    busy = false;
  }
}

storyCard.addEventListener("click", () => {
  setStoryVisible(storyCard.getAttribute("aria-expanded") === "false");
});
again.addEventListener("click", () => {
  storyIndex++;
  if (storyIndex === storyOrder.length) startRound();
  restart();
  storyCard.focus();
});
startRound();
restart();
</script>
