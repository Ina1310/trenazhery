<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сложение в столбик с переходом уровень 1</title>
<style>

:root {
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color: #2c1950;
  background: #eee4ff;
  --violet: #7438da;
  --violet-deep: #5320a6;
  --lime: #d1fe17;
}
* { box-sizing: border-box; }
body {
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  display: grid;
  place-items: center;
  padding: 14px;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 6% 9%, #faf4ff 0, transparent 47%),
    radial-gradient(ellipse at 98% 100%, #c4f7ed 0, transparent 45%),
    #eee4ff;
}
body::before, body::after {
  content: "";
  position: fixed;
  z-index: -1;
  pointer-events: none;
  width: clamp(80px, 17vw, 232px);
  aspect-ratio: 1;
}
body::before {
  top: 7%;
  left: 6%;
  border: clamp(10px, 1.7vw, 26px) solid #d8b8ff;
  border-radius: 41% 59% 57% 43%;
  transform: rotate(-24deg);
}
body::after {
  right: 5%;
  bottom: 8%;
  border-radius: 40% 60% 50% 50%;
  background:
    radial-gradient(circle at 78% 16%, #b8e700 0 4%, transparent 4.5%),
    radial-gradient(circle at 30% 18%, #a16cf1 0 5%, transparent 5.5%),
    radial-gradient(ellipse at 56% 67%, #a0eddf 0 44%, transparent 44.5%);
  transform: rotate(-12deg);
}
main {
  width: min(100%, 730px);
  text-align: center;
  background: #faf6ff;
  border: 3px solid #fff;
  border-radius: 34px;
  box-shadow: 0 7px 0 #d7c0f7, 0 23px 55px #5320a620;
}
.top {
  display: grid;
  justify-items: center;
  gap: 7px;
  padding: 15px 14px 9px;
}
h1 {
  margin: 0;
  color: var(--violet-deep);
  font-size: clamp(28px, 5.5vw, 46px);
  line-height: 1.04;
  font-weight: 900;
  letter-spacing: -.035em;
}
p { margin: 0; }
#progress {
  width: fit-content;
  margin: 0;
  padding: 4px 12px;
  border-radius: 99px;
  background: #ead8ff;
  color: var(--violet-deep);
  font-size: 14px;
  line-height: 1.15;
  font-weight: 750;
}

button { font: inherit; cursor: pointer; touch-action: manipulation; }
.exercise { padding: 0 clamp(8px, 3vw, 25px) 14px; }
h1 { font-size: clamp(24px, 4.6vw, 39px); }
#instruction { margin: 0 0 11px; font-size: clamp(15px, 2.6vw, 18px); font-weight: 750; }
.examples { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(9px, 1.7vw, 16px); }
.example {
  display: grid;
  justify-content: center;
  padding: 16px 4px;
  border: 2px solid #e0ccfc;
  border-radius: 15px;
  background: #fff;
  box-shadow: 0 3px 0 #eee3fd;
}
.column {
  display: grid;
  grid-template-columns: .6em repeat(2, .95em);
  align-items: center;
  justify-items: end;
  color: #2c1950;
  font-size: clamp(34px, 5vw, 49px);
  font-weight: 850;
  line-height: 1.02;
}
.first, .second {
  grid-column: 2 / 4;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  justify-items: center;
  width: 100%;
}
.first { grid-row: 2; }
.symbol { grid-column: 1; grid-row: 3; justify-self: start; }
.second { grid-row: 3; }
.rule { grid-column: 1 / -1; grid-row: 4; width: 100%; height: 3px; margin: 3px 0 4px; background: #5320a6; border-radius: 2px; }
.answer {
  grid-row: 5;
  justify-self: center;
  width: .88em;
  height: 1.33em;
  padding: 0;
  border: 2px solid #c8a7f3;
  border-radius: 8px;
  background: #f8f1ff;
  color: #2c1950;
  text-align: center;
  font: inherit;
}
.answer.carry {
  grid-column: 2;
  grid-row: 1;
  width: .94em;
  height: 1.02em;
  margin-bottom: 3px;
  border-color: #3562c4;
  border-radius: 6px;
  background: #edf4ff;
  color: #214aae;
  caret-color: #214aae;
  font-size: .86em;
}
.answer.carry.correct { background: #edf4ff; border-color: #3562c4; }
.answer.carry[aria-invalid="true"] { background: #ffd1d8; border-color: #a81930; }
.tens { grid-column: 2; }
.units { grid-column: 3; }
.answer:disabled { background: #f8f5fb; }
.answer:focus-visible, #next:focus-visible, #restart:focus-visible { outline: 2px solid var(--violet-deep); outline-offset: 2px; }
.answer[aria-invalid="true"] { border-color: #c92d42; background: #ffe4e8; }
.answer.correct { border-color: #388331; background: #eaff9a; }
#next, #restart {
  min-height: 38px;
  padding: 6px 17px;
  border: 2px solid #719500;
  border-bottom-width: 5px;
  border-radius: 13px;
  background: var(--lime);
  color: #273600;
  font-weight: 850;
}
#next { margin-top: 12px; }
#next[hidden] { display: inline-block; visibility: hidden; }
.completion { padding: 10px 12px 20px; }
.completion h2 { margin: 0 0 12px; }
@media (max-height: 650px) {
  .top { gap: 4px; padding-block: 9px 6px; }
  h1 { font-size: clamp(23px, 4.6vw, 31px); }
  .example { padding-block: 12px; }
  .column { font-size: clamp(32px, 4.3vw, 44px); }
  #instruction { margin-bottom: 7px; }
  #next { margin-top: 8px; }
}
@media (max-width: 520px) {
  .examples { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .column { font-size: clamp(29px, 7vw, 38px); }
  .example { padding-block: 4px; }
}
@media (max-width: 420px) {
  body { padding: 8px; }
  main { border-radius: 24px; }
  .example { border-radius: 11px; }
}
</style>
</head>
<body>
<main>
  <header class="top"><h1>Сложение в столбик с переходом уровень 1</h1><p id="progress"></p></header>
  <div class="exercise">
    <p id="instruction">Впиши перенос в синюю клетку, затем единицы и десятки под чертой.</p>
    <div class="examples" id="examples" role="group" aria-labelledby="instruction"></div>
    <button id="next" type="button" hidden>Дальше</button>
  </div>
  <section class="completion" hidden>
    <h2>Все примеры решены!</h2>
    <button id="restart" type="button">Начать заново</button>
  </section>
</main>
<template id="example-template">
  <div class="example">
    <div class="column">
      <input class="answer carry" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
      <span class="first" aria-hidden="true"></span>
      <span class="symbol" aria-hidden="true"></span>
      <span class="second" aria-hidden="true"></span>
      <span class="rule" aria-hidden="true"></span>
      <input class="answer units" type="text" inputmode="numeric" maxlength="1" autocomplete="off" disabled>
      <input class="answer tens" type="text" inputmode="numeric" maxlength="1" autocomplete="off" disabled>
    </div>
  </div>
</template>
<script>
  const worksheets = [
    [[36,"+",45],[79,"+",16],[36,"+",24],[39,"+",43]],
    [[22,"+",59],[58,"+",34],[12,"+",48],[17,"+",46]],
    [[34,"+",57],[39,"+",33],[56,"+",28],[37,"+",28]],
    [[59,"+",37],[23,"+",28],[18,"+",72],[35,"+",47]],
    [[14,"+",46],[46,"+",27],[49,"+",45],[17,"+",56]],
    [[18,"+",56],[35,"+",18],[19,"+",47],[26,"+",54]],
    [[67,"+",15],[17,"+",19],[66,"+",18],[43,"+",47]],
    [[19,"+",67],[18,"+",73],[18,"+",28],[18,"+",53]],
    [[35,"+",37],[33,"+",57],[41,"+",19],[26,"+",47]],
    [[38,"+",34],[18,"+",46],[15,"+",75],[26,"+",24]],
    [[37,"+",13],[27,"+",29],[25,"+",29],[34,"+",18]],
    [[25,"+",19],[39,"+",42],[15,"+",78],[47,"+",39]],
    [[29,"+",37],[62,"+",28],[35,"+",48],[27,"+",55]],
    [[47,"+",43],[23,"+",17],[38,"+",14],[54,"+",27]],
    [[56,"+",38],[16,"+",56],[37,"+",25],[29,"+",68]],
    [[18,"+",19],[57,"+",19],[49,"+",17],[69,"+",11]],
    [[25,"+",37],[14,"+",26],[19,"+",11],[42,"+",38]],
    [[14,"+",19],[27,"+",43],[42,"+",48],[17,"+",76]],
    [[56,"+",37],[38,"+",43],[17,"+",35],[25,"+",56]],
    [[18,"+",44],[26,"+",18],[54,"+",29],[46,"+",47]]
  ];
  const examples = document.querySelector('#examples');
  const progress = document.querySelector('#progress');
  const template = document.querySelector('#example-template');
  const exercise = document.querySelector('.exercise');
  const completion = document.querySelector('.completion');
  const next = document.querySelector('#next');
  const restart = document.querySelector('#restart');
  const storageKey = 'column-addition-carry-level-1-four-order';
  let previousOrder = null;
  try {
    previousOrder = JSON.parse(localStorage.getItem(storageKey));
  } catch {
    // Shuffling still works when storage is unavailable.
  }
  let pages = makeRound();
  let pageIndex = 0;

  function shuffleIndexes(length, previous = []) {
    const order = Array.from({length}, (_, index) => index);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    if (order.every((value, index) => value === previous?.[index])) {
      order.push(order.shift());
    }
    return order;
  }

  function makeRound() {
    const pageOrder = shuffleIndexes(worksheets.length, previousOrder?.pages);
    const exampleOrders = worksheets.map((worksheet, index) => (
      shuffleIndexes(worksheet.length, previousOrder?.examples?.[index])
    ));
    previousOrder = {pages: pageOrder, examples: exampleOrders};
    try {
      localStorage.setItem(storageKey, JSON.stringify(previousOrder));
    } catch {
      // The current round is already shuffled.
    }
    return pageOrder.map(index => exampleOrders[index].map(position => worksheets[index][position]));
  }

  function showDigits(row, number) {
    for (const digit of String(number)) {
      const cell = document.createElement('span');
      cell.textContent = digit;
      row.append(cell);
    }
  }

  function checkDigit(field, expected) {
    const digit = field.value.replace(/[^0-9]/g, '').slice(0, 1);
    if (digit !== field.value) field.value = digit;
    const correct = digit === String(expected);
    field.classList.toggle('correct', correct);
    if (digit && !correct) field.setAttribute('aria-invalid', 'true');
    else field.removeAttribute('aria-invalid');
    return correct;
  }

  function showPage() {
    progress.textContent = 'Страница ' + (pageIndex + 1) + ' из ' + pages.length;
    next.textContent = pageIndex === pages.length - 1 ? 'Готово' : 'Дальше';
    next.hidden = true;
    examples.replaceChildren();
    const entries = [];

    for (const [first, sign, second] of pages[pageIndex]) {
      const card = template.content.firstElementChild.cloneNode(true);
      showDigits(card.querySelector('.first'), first);
      card.querySelector('.symbol').textContent = sign;
      showDigits(card.querySelector('.second'), second);
      const fields = ['.carry', '.units', '.tens'].map(selector => card.querySelector(selector));
      const sum = first + second;
      const expected = [Math.floor((first % 10 + second % 10) / 10), sum % 10, Math.floor(sum / 10)];
      const stages = ['Перенос в десятки', 'Единицы ответа', 'Десятки ответа'];
      const label = first + ' плюс ' + second;
      fields.forEach((field, index) => field.setAttribute('aria-label', label + '. ' + stages[index]));
      entries.push(fields);

      fields.forEach(field => {
        field.addEventListener('input', () => {
          const correct = fields.map((cell, index) => checkDigit(cell, expected[index]));
          fields[1].disabled = !correct[0];
          fields[2].disabled = !correct[0] || !correct[1];

          next.hidden = entries.some(entry => entry.some(cell => !cell.classList.contains('correct')));
          if (!field.classList.contains('correct')) return;

          const pending = fields.find(cell => !cell.classList.contains('correct'));
          if (pending) {
            pending.focus({preventScroll: true});
            return;
          }

          const position = entries.indexOf(fields);
          const remaining = [...entries.slice(position + 1), ...entries.slice(0, position)];
          const nextField = remaining.flat().find(cell => !cell.classList.contains('correct')) ?? next;
          nextField.focus({preventScroll: true});
        });
      });
      examples.append(card);
    }
  }

  next.addEventListener('click', () => {
    if (pageIndex === pages.length - 1) {
      exercise.hidden = true;
      completion.hidden = false;
      restart.focus();
    } else {
      pageIndex++;
      showPage();
      examples.querySelector('.carry').focus({preventScroll: true});
    }
  });

  restart.addEventListener('click', () => {
    pages = makeRound();
    pageIndex = 0;
    completion.hidden = true;
    exercise.hidden = false;
    showPage();
    examples.querySelector('.carry').focus({preventScroll: true});
  });

  showPage();
  examples.querySelector('.carry').focus({preventScroll: true});
</script>
</body>
</html>
