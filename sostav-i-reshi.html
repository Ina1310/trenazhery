<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Составь и реши задачу</title>
<style>

:root {
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color: #2c1950;
  background: #eee4ff;
  --violet: #7438da;
  --violet-deep: #5320a6;
  --turquoise: #31d5c3;
  --lime: #d1fe17;
}
* { box-sizing: border-box; }
body {
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  display: grid;
  place-items: center;
  padding: 14px;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 6% 9%, #faf4ff 0, transparent 47%),
    radial-gradient(ellipse at 98% 100%, #c4f7ed 0, transparent 45%),
    #eee4ff;
}
body::before, body::after {
  content: "";
  position: fixed;
  z-index: -1;
  pointer-events: none;
  width: clamp(80px, 17vw, 232px);
  aspect-ratio: 1;
}
body::before {
  top: 7%;
  left: 6%;
  border: clamp(10px, 1.7vw, 26px) solid #d8b8ff;
  border-radius: 41% 59% 57% 43%;
  transform: rotate(-24deg);
}
body::after {
  right: 5%;
  bottom: 8%;
  border-radius: 40% 60% 50% 50%;
  background:
    radial-gradient(circle at 78% 16%, #b8e700 0 4%, transparent 4.5%),
    radial-gradient(circle at 30% 18%, #a16cf1 0 5%, transparent 5.5%),
    radial-gradient(ellipse at 56% 67%, #a0eddf 0 44%, transparent 44.5%);
  transform: rotate(-12deg);
}
main {
  width: min(100%, 690px);
  text-align: center;
  background: #faf6ff;
  border: 3px solid #fff;
  border-radius: 34px;
  box-shadow: 0 7px 0 #d7c0f7, 0 23px 55px #5320a620;
}
.top {
  display: grid;
  justify-items: center;
  gap: 7px;
  padding: 19px 14px 13px;
}
h1 {
  margin: 0;
  color: var(--violet-deep);
  font-size: clamp(28px, 5.5vw, 46px);
  line-height: 1.04;
  font-weight: 900;
  letter-spacing: -.035em;
}
p { margin: 0; }
.exercise { padding: 0 clamp(11px, 4vw, 35px) 17px; }
.story {
  max-width: 39rem;
  margin: 0 auto;
  padding: clamp(13px, 3vw, 21px) clamp(15px, 3.5vw, 27px);
  border: 2px solid #e0ccfc;
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 4px 0 #eee3fd;
  font-size: clamp(18px, 3.1vw, 24px);
  line-height: 1.35;
  text-align: left;
}
.story:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.question { margin-top: .48em; }
.question strong { color: var(--violet-deep); font-weight: 850; }
.choices { display: flex; justify-content: center; gap: clamp(13px, 3.2vw, 25px); }
button { font: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--violet-deep); outline-offset: 4px; }
button:disabled { cursor: default; opacity: 1; }
.choice {
  --face: var(--violet);
  --edge: #5024a2;
  --ink: #fff;
  width: clamp(92px, 20vw, 130px);
  height: clamp(59px, 13vw, 77px);
  padding: 0 0 3px;
  border: 2px solid var(--edge);
  border-bottom-width: 6px;
  border-radius: 19px;
  background-color: var(--face);
  color: var(--ink);
  box-shadow: inset 0 3px 0 #ffffff30;
  font-size: clamp(40px, 8vw, 56px);
  font-weight: 900;
  line-height: 1;
}
.choice:enabled:not(.incorrect):hover, #next:enabled:hover { filter: brightness(1.055); }
.choice:enabled:active, #next:enabled:active { transform: translateY(2px); }
.choice.incorrect { --face: #ffb6c0; --edge: #c92d42; --ink: #821a2c; }

#feedback {
  min-height: 1.35em;
  margin-top: 8px;
  font-size: 16px;
  font-weight: 750;
  line-height: 1.35;
}
#feedback.incorrect { color: #a81930; }
#feedback.correct { color: #416000; }
#next {
  min-height: 41px;
  margin-top: 3px;
  padding: 6px 20px 5px;
  border: 2px solid #719500;
  border-bottom-width: 5px;
  border-radius: 13px;
  background: var(--lime);
  color: #273600;
  font-weight: 850;
}


.top { padding-bottom: 13px; }
h1 { font-size: clamp(25px, 5vw, 40px); }
#instruction { margin: 14px 0 9px; font-weight: 750; font-size: clamp(16px, 2.7vw, 19px); }
.number {
  padding: 0 .28em;
  border: 1px solid #bfa7ee;
  border-radius: 6px;
  background: #eedfff;
  color: #1854aa;
  font-weight: 850;
  line-height: 1.15;
}
.number:enabled:hover { background: #e5d3fe; }
.equation {
  display: grid;
  grid-template-columns: repeat(5, auto);
  justify-content: center;
  align-items: end;
  gap: clamp(4px, 1.8vw, 13px);
  margin: 0 auto 9px;
}
.entry, #operator {
  width: clamp(42px, 11vw, 62px);
  height: clamp(44px, 10vw, 53px);
  padding: 0;
  border: 2px solid #c8a7f3;
  border-bottom-width: 4px;
  border-radius: 10px;
  background: #fff;
  color: #2c1950;
  text-align: center;
  font: 850 clamp(23px, 5vw, 31px)/1 "Trebuchet MS", system-ui, sans-serif;
}
.entry.active { border-color: var(--violet); box-shadow: 0 0 0 2px #ebdbff; }
.entry:focus-visible { outline: 2px solid var(--violet-deep); outline-offset: 2px; }
#operator { display: grid; place-items: center; background: #f4e9ff; }
.equals { align-self: end; display: grid; place-items: center; height: clamp(44px, 10vw, 53px); font-size: clamp(24px, 5vw, 32px); font-weight: 900; }
.operator-stack { display: grid; justify-items: center; gap: 7px; }
.choices { gap: 5px; }
[hidden] { display: none !important; }
#next[hidden] { display: inline-block !important; visibility: hidden; }
.completion { padding: 16px 16px 26px; }
.completion h2 { margin: 0 0 12px; }
#restart { padding: 7px 16px; border: 2px solid #719500; border-bottom-width: 5px; border-radius: 13px; background: var(--lime); color: #273600; font-weight: 850; }
.choice {
  width: clamp(34px, 10vw, 44px);
  height: 41px;
  border-radius: 13px;
  border-bottom-width: 5px;
  font-size: clamp(24px, 5.5vw, 31px);
}
.choice[aria-pressed="true"] { outline: 3px solid #c92d42; outline-offset: 2px; }
.choice[aria-pressed="true"].correct { outline-color: #388331; }
#next { margin-top: 5px; }
.entry[aria-invalid="true"], #operator.invalid { border-color: #c92d42; background: #ffe4e8; box-shadow: none; }
.entry.correct, #operator.correct { border-color: #388331; background: #eaff9a; box-shadow: none; }
#feedback { margin-top: 6px; }
@media (max-height: 550px) {
  .top { padding-block: 10px 8px; }
  .exercise { padding-bottom: 10px; }
  .story { padding-block: 9px; }
  #instruction { margin-block: 9px 6px; }
  .equation { margin-bottom: 6px; }
}
@media (max-width: 430px) {
  body { padding: 8px; }
  main { border-radius: 24px; }
  .story { border-radius: 16px; }
}

#progress { width: fit-content; margin: 0; padding: 4px 12px; border-radius: 99px; background: #ead8ff; color: var(--violet-deep); font-size: 14px; font-weight: 750; }
.story { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(8px, 2vw, 18px); align-items: center; }
.illustration {
  width: clamp(62px, 11vw, 116px);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  background: #fff;
  border: 1px solid #e4d5fa;
  border-radius: 15px;
  overflow: hidden;
  font-size: clamp(36px, 6vw, 62px);
}

  .top { gap: 4px; padding-block: 8px 6px; }
  .top h1 { font-size: clamp(23px, 4.5vw, 33px); }
  #progress { padding-block: 2px; }
  .story { font-size: clamp(17px, 3.1vw, 21px); line-height: 1.26; }
  .illustration { width: clamp(55px, 8vw, 80px); }
  #instruction { margin-block: 8px 5px; }
  .choice { height: 38px; }
  .entry, #operator, .equals { height: 43px; }
  .operator-stack { gap: 5px; }
  #feedback { margin-top: 4px; }
}
@media (max-width: 430px) {
  .story { padding-inline: 10px; }
  .illustration { width: clamp(43px, 16vw, 66px); font-size: 32px; border-radius: 10px; }
}
</style>
</head>
<body>
<main>
  <header class="top"><h1>Составь и реши задачу</h1><p id="progress"></p></header>
  <div class="exercise">
    <div class="story" tabindex="-1" aria-label="Условие задачи">
      <div>
        <p><span class="story-text"></span><button class="number" type="button"></button><span class="story-text"></span><button class="number" type="button"></button><span class="story-text"></span></p>
        <p class="question"><strong id="cue"></strong> <span id="question-tail"></span></p>
      </div>
      <div class="illustration has-art" id="illustration" aria-hidden="true"></div>
    </div>
    <form novalidate>
      <p id="instruction">Возьми числа из текста, выбери знак и впиши ответ.</p>
      <div class="equation" role="group" aria-label="Запись решения">
        <input class="entry operand active" aria-label="Первое число" type="text" inputmode="numeric" maxlength="2" autocomplete="off">
        <div class="operator-stack">
          <div class="choices" role="group" aria-label="Выбери знак">
            <button type="button" class="choice" value="plus" aria-label="Плюс" aria-pressed="false">+</button>
            <button type="button" class="choice" value="minus" aria-label="Минус" aria-pressed="false">−</button>
          </div>
          <span id="operator" aria-label="Знак действия">?</span>
        </div>
        <input class="entry operand" aria-label="Второе число" type="text" inputmode="numeric" maxlength="2" autocomplete="off">
        <span class="equals">=</span>
        <input class="entry" id="answer" aria-label="Ответ" type="text" inputmode="numeric" maxlength="2" autocomplete="off">
      </div>
      <p id="feedback" role="status" aria-atomic="true"></p>
      <button id="next" type="button" hidden>Дальше</button>
    </form>
  </div>
  <section class="completion" id="completion" hidden>
    <h2>Все 20 задач решены!</h2>
    <button id="restart" type="button">Начать заново</button>
  </section>
</main>
<script>
  const cards = [
    {"sign":"plus","values":[2,3,5],"text":["В корзине "," яблока и "," груши."],"tail":"фруктов в корзине?","art":0},
    {"sign":"plus","values":[4,3,7],"text":["На стоянке "," зелёные машины и "," белые машины."],"tail":"машин на стоянке?","art":1},
    {"sign":"plus","values":[3,5,8],"text":["В коробке "," синих кубика и "," жёлтых кубиков."],"tail":"кубиков в коробке?","art":2},
    {"sign":"plus","values":[2,4,6],"text":["На столе "," белые чашки и "," фиолетовые чашки."],"tail":"чашек на столе?","art":3},
    {"sign":"plus","values":[5,2,7],"text":["У Даши было "," наклеек. Мама подарила ей ещё "," наклейки."],"tail":"наклеек у Даши?","art":4},
    {"sign":"plus","values":[3,4,7],"text":["В пенале лежали "," карандаша. Саша положил туда ещё "," карандаша."],"tail":"карандашей в пенале?","art":5},
    {"sign":"plus","values":[4,2,6],"text":["На заборе сидели "," воробья. Прилетели ещё "," воробья."],"tail":"воробьёв на заборе?","art":6},
    {"sign":"plus","values":[3,2,5],"text":["В вазе "," тюльпана и "," ромашки."],"tail":"цветов в вазе?","art":7},
    {"sign":"plus","values":[4,4,8],"text":["В коробке было "," конфеты. Миша добавил туда ещё "," конфеты."],"tail":"конфет в коробке?","art":8},
    {"sign":"plus","values":[3,3,6],"text":["У берега плавали "," утки. К ним подплыли ещё "," утки."],"tail":"уток у берега?","art":9},
    {"sign":"minus","values":[7,2,5],"text":["У Коли было "," шариков. "," шарика лопнули."],"tail":"шариков у Коли?","art":10},
    {"sign":"minus","values":[8,3,5],"text":["Было "," стаканов сока. Дети выпили "," стакана."],"tail":"стаканов сока?","art":11},
    {"sign":"minus","values":[9,4,5],"text":["На тарелке лежало "," печений. Аня съела "," печенья."],"tail":"печений на тарелке?","art":12},
    {"sign":"minus","values":[8,2,6],"text":["На полке было "," книг. Теперь "," книги у ребят, остальные на полке."],"tail":"книг на полке?","art":13},
    {"sign":"minus","values":[6,2,4],"text":["В корзине было "," мячей. Петя взял "," мяча."],"tail":"мячей в корзине?","art":14},
    {"sign":"minus","values":[8,4,4],"text":["В ящике было "," варежек. Оля достала "," варежки."],"tail":"варежек в ящике?","art":15},
    {"sign":"minus","values":[6,3,3],"text":["На столе было "," яблок. Лена отдала "," яблока друзьям."],"tail":"яблок на столе?","art":0},
    {"sign":"minus","values":[9,3,6],"text":["На парковке стояло "," машин. "," машины уехали."],"tail":"машин на парковке?","art":1},
    {"sign":"minus","values":[8,4,4],"text":["На клумбе росло "," тюльпанов. Срезали "," тюльпана."],"tail":"тюльпанов на клумбе?","art":7},
    {"sign":"minus","values":[7,2,5],"text":["На ветке сидели "," воробьёв. "," воробья улетели."],"tail":"воробьёв на ветке?","art":6}
  ];
  const exercise = document.querySelector('.exercise');
  const completion = document.querySelector('#completion');
  const form = document.querySelector('form');
  const operands = [...form.querySelectorAll('.operand')];
  const answer = document.querySelector('#answer');
  const operator = document.querySelector('#operator');
  const feedback = document.querySelector('#feedback');
  const next = document.querySelector('#next');
  const restart = document.querySelector('#restart');
  const numberButtons = [...document.querySelectorAll('.number')];
  const signs = [...form.querySelectorAll('.choice')];
  const editable = [...operands, answer];
  const progress = document.querySelector('#progress');
  const story = document.querySelector('.story');
  const storyText = [...document.querySelectorAll('.story-text')];
  const cue = document.querySelector('#cue');
  const questionTail = document.querySelector('#question-tail');
  const illustration = document.querySelector('#illustration');
  let order = shuffle(cards);
  let index = 0;
  let task = order[index];
  let active = 0;
  let sign = '';

  function selectOperand(index) {
    active = index;
    operands.forEach((field, position) => field.classList.toggle('active', position === index));
  }

  function markInvalid(field, invalid) {
    if (invalid) field.setAttribute('aria-invalid', 'true');
    else field.removeAttribute('aria-invalid');
  }

  function checkAnswer() {
    let correctFields = 0;
    let hasError = false;
    editable.forEach((field, index) => {
      const filled = field.value !== '';
      const correct = filled && Number(field.value) === task.values[index];
      const invalid = filled && !correct;
      field.classList.toggle('correct', correct);
      markInvalid(field, invalid);
      if (correct) correctFields++;
      if (invalid) hasError = true;
    });

    const signCorrect = sign === task.sign;
    const signInvalid = sign !== '' && !signCorrect;
    operator.classList.toggle('correct', signCorrect);
    operator.classList.toggle('invalid', signInvalid);
    signs.forEach(button => button.classList.toggle('correct', signCorrect && button.value === sign));

    const solved = correctFields === editable.length && signCorrect;
    next.hidden = !solved;
    if (solved) {
      feedback.textContent = 'Верно!';
      feedback.className = 'correct';
    } else if (hasError || signInvalid) {
      feedback.textContent = 'Проверь поля, выделенные красным.';
      feedback.className = 'incorrect';
    } else {
      feedback.textContent = '';
      feedback.className = '';
    }
  }

  operands.forEach((field, index) => {
    field.addEventListener('focus', () => selectOperand(index));
  });

  for (const field of editable) {
    field.addEventListener('input', () => {
      const digits = field.value.replace(/[^0-9]/g, '');
      if (field.value !== digits) field.value = digits;
      checkAnswer();
    });
  }

  for (const button of numberButtons) {
    button.addEventListener('click', () => {
      const field = operands[active];
      field.value = button.dataset.value;
      checkAnswer();
      const other = 1 - active;
      if (field.classList.contains('correct') && !operands[other].classList.contains('correct')) {
        selectOperand(other);
      }
    });
  }

  for (const button of signs) {
    button.addEventListener('click', () => {
      sign = button.value;
      operator.textContent = button.textContent;
      signs.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      checkAnswer();
    });
  }

  form.addEventListener('submit', event => event.preventDefault());

  function shuffle(items) {
    const shuffled = [...items];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
  }

  function showTask() {
    task = order[index];
    progress.textContent = 'Задача ' + (index + 1) + ' из ' + order.length;
    storyText.forEach((part, position) => { part.textContent = task.text[position]; });
    numberButtons.forEach((button, position) => {
      const value = String(task.values[position]);
      button.dataset.value = value;
      button.textContent = value;
      button.setAttribute('aria-label', 'Взять число ' + value);
    });
    cue.textContent = task.sign === 'plus' ? 'Сколько всего' : 'Сколько осталось';
    questionTail.textContent = task.tail;
    illustration.style.backgroundPosition = (task.art % 4) * 100 / 3 + '% ' + Math.floor(task.art / 4) * 100 / 3 + '%';

    form.reset();
    signs.forEach(item => item.setAttribute('aria-pressed', 'false'));
    operator.textContent = '?';
    sign = '';
    selectOperand(0);
    checkAnswer();
  }

  next.addEventListener('click', () => {
    if (index + 1 < order.length) {
      index++;
      showTask();
      story.focus({preventScroll: true});
    } else {
      exercise.hidden = true;
      completion.hidden = false;
      restart.focus();
    }
  });

  restart.addEventListener('click', () => {
    order = shuffle(cards);
    index = 0;
    completion.hidden = true;
    exercise.hidden = false;
    showTask();
    story.focus({preventScroll: true});
  });

  showTask();
</script>
</body>
</html>
